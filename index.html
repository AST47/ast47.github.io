<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ahmad Saleh Tuffaha — Apps</title>
<link rel="icon" type="image/png" href="images/logo-icon.png">
<meta name="description" content="Web apps and tools built by Ahmad Saleh Tuffaha.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   TOKENS — keep identical to index.html / projects.html so the site feels unified
   ============================================================ */
:root{
  --cream:#f5f2eb;
  --ink-light:#e3e1da;
  --maroon-light:#ebdfd8;
  --ink:#1a1a18;
  --ink-soft:#5a5a55;
  --accent:#7d0102;
  --accent-wash:rgba(125,1,2,.07);
  --radius:14px;
  --maxw:880px;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}

html[lang="ar"] body{font-family:'Cairo',sans-serif;}
html[lang="en"] body, html[lang="tr"] body{font-family:'Lora',serif;}

a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}

.dot-grid{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(26,26,24,.09) 1px, transparent 1px);
  background-size:28px 28px;
}

/* ---------- header (identical pattern to index.html) ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(245,242,235,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--ink-light);
}
.nav-wrap{
  direction:ltr;
  max-width:var(--maxw);margin:0 auto;
  padding:16px 24px;
  display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:10px;
}
@media(max-width:480px){
  .nav-wrap{padding:14px 16px;gap:6px;}
}
.logo-mark{grid-column:1;justify-self:center;display:flex;align-items:center;}
.logo-mark .mark-img{height:32px;width:auto;display:block;}
.nav-name{
  grid-column:2;justify-self:center;text-align:center;text-decoration:none;
  display:flex;flex-direction:row;align-items:center;gap:10px;
  font-weight:800;font-size:clamp(10.5px,2.9vw,22px);
  white-space:nowrap;max-width:100%;
}
@media(max-width:640px){
  .nav-name{flex-direction:column;align-items:center;gap:3px;}
}
html[lang="ar"] .nav-name{direction:rtl;}
html[lang="en"] .nav-name, html[lang="tr"] .nav-name{font-weight:700;}
.nav-name .role{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:clamp(9px,2.1vw,14.5px);color:var(--accent);letter-spacing:.03em;
  white-space:nowrap;
}
.nav-name .role .dash{width:16px;height:1.5px;background:var(--accent);display:inline-block;flex-shrink:0;}
.lang-switch{grid-column:3;justify-self:center;display:flex;gap:4px;background:var(--ink-light);border:1px solid var(--ink-light);border-radius:999px;padding:3px;}
.lang-switch button{border:none;background:transparent;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;color:var(--ink-soft);padding:6px 13px;border-radius:999px;transition:background .2s, color .2s;}
.lang-switch button.active{background:var(--ink);color:var(--cream);}
.lang-switch button:hover:not(.active){color:var(--ink);}

/* ---------- page head ---------- */
.page-head{max-width:var(--maxw);margin:0 auto;padding:50px 24px 10px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:22px;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:15px;height:15px;stroke:currentColor;}
html[dir="rtl"] .back-link svg{transform:scaleX(-1);}
.page-title{font-size:clamp(1.7rem,4.4vw,2.5rem);font-weight:800;}
html[lang="en"] .page-title, html[lang="tr"] .page-title{font-weight:700;}

/* ---------- item cards (identical to projects.html "other work" style) ---------- */
section{max-width:var(--maxw);margin:0 auto;padding:26px 24px 70px;}
.item-grid{display:flex;flex-direction:column;gap:36px;}

.item-card{
  position:relative;
  border-top:3px solid var(--accent);padding-top:24px;
  transition:opacity .2s;
}
.item-card:hover{opacity:.85;}
.item-body{position:relative;z-index:1;}
.item-top{display:flex;flex-direction:column;gap:20px;position:relative;z-index:1;}
@media(min-width:480px){.item-top{flex-direction:row;align-items:center;gap:24px;}}
.item-ext{width:15px;height:15px;stroke:var(--ink-soft);flex-shrink:0;margin-inline-start:auto;transition:stroke .2s;align-self:flex-start;}
.item-card:hover .item-ext{stroke:var(--accent);}
.item-emoji{width:128px;height:128px;border-radius:20px;background:var(--maroon-light);border:1px solid var(--ink-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:48px;}
.item-emoji img{width:72%;height:72%;object-fit:contain;}
.item-text-col{flex:1;min-width:0;}
.item-title{font-size:19px;font-weight:800;line-height:1.4;position:relative;z-index:1;}
html[lang="en"] .item-title, html[lang="tr"] .item-title{font-weight:700;}
.item-blurb{font-size:14px;line-height:1.85;color:var(--accent);margin-top:6px;position:relative;z-index:1;}

.empty-state{
  grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:15px;
  border:1px dashed var(--ink-light);border-radius:var(--radius);
}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--ink-light);padding:34px 24px;max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;}
@media(max-width:480px){
  footer{grid-template-columns:1fr;gap:18px;}
  .foot-copy{justify-self:center !important;text-align:center;}
  .footer-logo{justify-self:center;}
  .foot-socials{justify-self:center !important;}
}
.footer-logo{display:block;justify-self:center;}
.footer-logo img{height:72px;width:auto;display:block;}
.foot-copy{font-size:13px;color:var(--ink-soft);justify-self:start;text-align:start;}
.foot-socials{display:flex;gap:10px;justify-self:end;}
.social-btn{width:44px;height:44px;border-radius:10px;background:var(--ink-light);border:1px solid var(--ink-light);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .2s, color .2s, background .2s;}
.social-btn:hover{background:transparent;}
.social-linkedin:hover{border-color:#0A66C2;color:#0A66C2;}
.social-email:hover{border-color:var(--accent);color:var(--accent);}
.social-whatsapp:hover{border-color:#1f7a4a;color:#1f7a4a;}
.social-btn svg{width:20px;height:20px;}
</style>
</head>
<body>

<div class="dot-grid"></div>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo-mark" aria-label="أحمد صالح تفاحة">
      <img class="mark-img" src="images/logo-icon.png" alt="AST">
    </a>
    <a href="index.html" class="nav-name">
      <span data-i18n="nav.name">أحمد صالح تفاحة</span>
      <span class="role"><span class="dash"></span><span data-i18n="nav.role">مطوّر أعمال</span><span class="dash"></span></span>
    </a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="ar" class="active">AR</button>
      <button data-lang="en">EN</button>
      <button data-lang="tr">TR</button>
    </div>
  </div>
</header>

<main>
  <div class="page-head">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span data-i18n="back">عودة للرئيسية</span>
    </a>
    <h1 class="page-title" data-i18n="page.title">أفكار تحولت لتطبيقات</h1>
  </div>

  <section>
    <div class="item-grid" id="item-grid"></div>
  </section>
</main>

<footer>
  <span class="foot-copy" data-i18n="footer.copy">© 2026 أحمد صالح تفاحة — جميع الحقوق محفوظة</span>
  <a href="index.html" class="footer-logo"><img src="images/Logo.png" alt="Ahmad Saleh Tuffaha — Business Development"></a>
  <div class="foot-socials">
    <a class="social-btn social-linkedin" href="https://www.linkedin.com/in/ahmad-saleh-tuffaha/" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2ZM8 19H5V9h3ZM6.5 7.7A1.7 1.7 0 1 1 8.2 6a1.7 1.7 0 0 1-1.7 1.7ZM19 19h-3v-4.7c0-1.1 0-2.6-1.6-2.6s-1.8 1.2-1.8 2.5V19h-3V9h2.9v1.3h0a3.1 3.1 0 0 1 2.8-1.6c3 0 3.6 2 3.6 4.6Z"/></svg>
    </a>
    <a class="social-btn social-email" href="mailto:ahmadsalehtuffaha@gmail.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
    </a>
    <a class="social-btn social-whatsapp" href="https://wa.me/905525407377" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
    </a>
  </div>
</footer>

<script>
/* ============================================================
   CONTENT — copied verbatim from projects.html's "other work" list.
   Add new apps here the same way.
   ============================================================ */
const ITEMS = [
  {
    emoji: "📿",
    image: "images/Azkar.png",
    date: "2026",
    url: "https://ast47.github.io/Azkar/",
    title: { ar: "أذكار وأدعية", en: "Azkar & Duas", tr: "Ezkar ve Dualar" },
    blurb: {
      ar: "تطبيق ويب لأذكار وأدعية يومية، بإمكانية إضافة وتعديل المحتوى.<br>لاحقاً تطوّر ليصبح أشمل، وتمت إضافة صفحة متابعة يومية، وصفحة عدّادة، وأوقات الصلاة.",
      en: "A web app for daily Islamic remembrances and prayers, with editable content.<br>It later evolved into something more complete, adding a daily tracking page, a counter page, and prayer times.",
      tr: "Günlük zikir ve dualar için düzenlenebilir içerikli bir web uygulaması.<br>Daha sonra gelişti ve günlük takip sayfası, bir sayaç sayfası ve namaz vakitleri eklendi."
    }
  },
  {
    emoji: "⚽",
    image: "images/WC2026.png",
    date: "2026",
    url: "https://ast47.github.io/worldcup2026/",
    title: { ar: "متابعة كأس العالم 2026", en: "FIFA World Cup 2026 Tracker", tr: "2026 Dünya Kupası Takip" },
    blurb: {
      ar: "أداة لمتابعة مباريات ونتائج كأس العالم 2026.",
      en: "A tracker for FIFA World Cup 2026 matches and results.",
      tr: "2026 Dünya Kupası maçlarını ve sonuçlarını takip aracı."
    }
  },
  // {
  //   emoji: "🛠️",
  //   date: "2026",
  //   url: "https://your-app-url.com",
  //   title: { ar: "اسم التطبيق", en: "App name", tr: "Uygulama adı" },
  //   blurb: { ar: "سطر مختصر عن التطبيق.", en: "One short line about it.", tr: "Kısa bir açıklama." }
  // },
];

const translations = {
  ar: {
    "nav.name": "أحمد صالح تفاحة",
    "nav.role": "مطوّر أعمال",
    "back": "عودة للرئيسية",
    "page.title": "أفكار تحولت لتطبيقات",
    "empty": "قريباً — أول تطبيق جاي.",
    "footer.copy": "© 2026 أحمد صالح تفاحة — جميع الحقوق محفوظة",
  },
  en: {
    "nav.name": "Ahmad Saleh Tuffaha",
    "nav.role": "Business Developer",
    "back": "Back to home",
    "page.title": "Ideas Turned Into Apps",
    "empty": "Coming soon — first app on the way.",
    "footer.copy": "© 2026 Ahmad Saleh Tuffaha — All rights reserved",
  },
  tr: {
    "nav.name": "Ahmad Saleh Tuffaha",
    "nav.role": "İş Geliştirme Uzmanı",
    "back": "Ana sayfaya dön",
    "page.title": "Uygulamaya Dönüşen Fikirler",
    "empty": "Yakında — ilk uygulama yolda.",
    "footer.copy": "© 2026 Ahmad Saleh Tuffaha — Tüm hakları saklıdır",
  }
};

function applyTranslations(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
  const dict = translations[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll(".lang-switch button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

function renderItems(lang){
  const grid = document.getElementById("item-grid");
  grid.innerHTML = "";
  if(ITEMS.length === 0){
    const p = document.createElement("p");
    p.className = "empty-state";
    p.textContent = translations[lang]["empty"];
    grid.appendChild(p);
    return;
  }
  ITEMS.forEach(item=>{
    const a = document.createElement("a");
    a.href = item.url; a.target = "_blank"; a.rel = "noopener";
    a.className = "item-card";
    const badgeContent = item.image
      ? `<img src="${item.image}" alt="" loading="lazy">`
      : (item.emoji || "🔗");
    a.innerHTML = `
      <div class="item-body">
        <div class="item-top">
          <span class="item-emoji">${badgeContent}</span>
          <div class="item-text-col">
            <span class="item-title">${item.title[lang] || item.title.ar}</span>
            <p class="item-blurb">${(item.blurb && (item.blurb[lang] || item.blurb.ar)) || ""}</p>
          </div>
          <svg class="item-ext" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </div>
      </div>`;
    grid.appendChild(a);
  });
}

function setLanguage(lang){
  localStorage.setItem("site-lang", lang);
  applyTranslations(lang);
  renderItems(lang);
}

document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=> setLanguage(btn.dataset.lang));
});

function detectLang(){
  const saved = localStorage.getItem("site-lang");
  if(translations[saved]) return saved;
  const nav = (navigator.language || navigator.userLanguage || "").toLowerCase();
  if(nav.startsWith("ar")) return "ar";
  if(nav.startsWith("tr")) return "tr";
  if(nav.startsWith("en")) return "en";
  return "ar";
}
setLanguage(detectLang());
</script>
</body>
</html>
